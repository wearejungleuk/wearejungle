title: 'Page Builder'
fields:
  -
    handle: page_builder
    field:
      type: replicator
      display: 'Page Builder'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            about_story:
              display: 'About Story'
              fields:
                -
                  handle: above_title
                  field:
                    type: text
                    display: 'Above Title'
                -
                  handle: above_title_variant
                  field:
                    type: select
                    display: 'Above Title Style'
                    options:
                      above-title--light-blue: 'Light Blue'
                      above-title--blue: Blue
                      above-title--black: Black
                      above-title--white: White
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: text
                  field:
                    remove_empty_nodes: false
                    type: bard
                    display: Text
                -
                  handle: cta
                  field:
                    type: link
                    display: CTA
                -
                  handle: cta_title
                  field:
                    type: text
                    display: 'CTA Title'
                -
                  handle: book_appointment
                  field:
                    type: toggle
                    display: 'Book a Call (uses Calendly link)'
                -
                  handle: cta_classes
                  field:
                    type: select
                    display: 'Button Style'
                    options:
                      button--primary: 'Primary Blue'
                      button--dark-blue: 'Dark Blue'
                      button--light-blue: 'Light Blue'
                      button--black: Black
                      button--white: White
                -
                  handle: image_1
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: 'Image 1 (top left)'
                    instructions: '660 x 550'
                -
                  handle: image_2
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: 'Image 2 (top right)'
                    instructions: '660 x 550'
                -
                  handle: image_3
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: 'Image 3 (bottom centre)'
                    instructions: '660 x 550'
            about_hero:
              display: 'About Hero'
              fields:
                -
                  handle: above_title
                  field:
                    type: text
                    display: 'Above Title (h1)'
                    validate:
                      - required
                    instructions: 'Renders as the page h1 - keep it short and SEO-focused (e.g. include a location like "Portsmouth" if relevant).'
                -
                  handle: above_title_variant
                  field:
                    type: select
                    display: 'Above Title Style'
                    options:
                      above-title--light-blue: 'Light Blue'
                      above-title--blue: Blue
                      above-title--black: Black
                      above-title--white: White
                -
                  handle: title
                  field:
                    type: text
                    display: 'Title (h2)'
                    instructions: 'The large hero headline. Renders as an h2 - the small above title above it is the h1.'
                -
                  handle: intro_text
                  field:
                    remove_empty_nodes: false
                    type: bard
                    display: 'Intro Text'
                -
                  handle: image_left
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: 'Image Left'
                    instructions: '660 x 880'
                -
                  handle: image_right
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: 'Image Right'
                    instructions: '660 x 550'
                -
                  handle: body_text_lead
                  field:
                    remove_empty_nodes: false
                    type: bard
                    display: 'Body Text (Lead)'
                -
                  handle: body_text
                  field:
                    remove_empty_nodes: false
                    type: bard
                    display: 'Body Text'
            home_hero:
