tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              placeholder: 'Your Name'
              validate:
                - required
          -
            handle: email
            field:
              input_type: email
              placeholder: 'Your Email'
              type: text
              display: Email
              validate:
                - required
          -
            handle: phone
            field:
              input_type: tel
              placeholder: 'Your Number'
              type: text
              display: Phone
              validate:
                - required
          -
            handle: website
            field:
              input_type: url
              placeholder: 'https://yourbusiness.co.uk'
              type: text
              display: 'Company website (if you have one)'
          -
            handle: message
            field:
              placeholder: 'A few lines about what you need.'
              type: textarea
              display: 'What you need'
              validate:
                - required
          -
            handle: budget
            field:
              options:
                -
                  key: under-5000
                  value: 'Under £5,000'
                -
                  key: 5000-10000
                  value: '£5,000 to £10,000'
                -
                  key: 10000-25000
                  value: '£10,000 to £25,000'
                -
                  key: 25000-50000
                  value: '£25,000 to £50,000'
                -
                  key: 50000-plus
                  value: '£50,000+'
                -
                  key: unsure
                  value: 'Not sure yet'
              type: select
              display: 'Rough budget'
              instructions: 'Optional. Knowing the range before the call saves both sides time.'
