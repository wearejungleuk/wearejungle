title: Service
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: card_text
            field:
              type: textarea
              display: 'Card Text (Homepage)'
              instructions: 'Short description shown on the homepage services section.'
          -
            handle: page_text
            field:
              type: textarea
              display: 'Page Text (Services Page)'
              instructions: 'Longer paragraph description shown on the services listing page.'
          -
            handle: card_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Card Image'
              instructions: 'Image shown on related service cards.'
              restrict: false
          -
            handle: icon
            field:
              max_files: 1
              container: assets
              type: assets
              display: Icon
              instructions: 'White icon on transparent background. Displayed on a black rounded square.'
      -
        display: 'Page Builder'
        fields:
          -
            handle: page_builder
            field: page_builder.page_builder
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
