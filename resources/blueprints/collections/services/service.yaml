title: Service
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: card_text
            field:
              type: textarea
              display: 'Card Text'
              instructions: 'Short description shown on the homepage services section.'
          -
            handle: icon
            field:
              max_files: 1
              container: assets
              type: assets
              display: Icon
              instructions: 'White icon on transparent background. Displayed on a black rounded square.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
