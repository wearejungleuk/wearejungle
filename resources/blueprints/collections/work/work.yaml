title: Work
tabs:
  main:
    display: Main
    sections:
      -
        display: Hero
        fields:
          -
            handle: title
            field:
              type: text
              display: 'Client / Project Name (eyebrow + H1 fallback)'
              required: true
              validate:
                - required
          -
            handle: seo_title
            field:
              type: text
              display: 'SEO Title'
          -
            handle: preview_text
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Hero Strapline'
              instructions: 'Large headline used at the top of the case study and in the listing card.'
          -
            handle: hero_background_colour
            field:
              type: select
              display: 'Hero Background Colour'
              instructions: 'Solid colour behind the hero.'
              default: brand-primary
              options:
                brand-primary: 'Primary Blue'
                brand-dark-blue: 'Dark Blue'
                brand-secondary: 'Secondary Pink'
                brand-light-blue: 'Light Blue'
                brand-text: 'Cream'
                black: Black
              clearable: false
          -
            handle: hero_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Hero Image (device mockup)'
              instructions: 'Composite screenshot shown inside the dark stage.'
          -
            handle: hero_logo
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Client Logo (hero, right side)'
              instructions: 'Transparent PNG or SVG shown to the right of the mockup.'
          -
            handle: website_url
            field:
              type: text
              input_type: url
              display: 'Website URL'
              instructions: 'Used for the VISIT WEBSITE button.'
          -
            handle: work_type
            field:
              type: terms
              taxonomies:
                - work_type
              display: 'Work Type Tags'
              mode: select
              create: true
      -
        display: Overview
        fields:
          -
            handle: overview_heading
            field:
              type: text
              display: 'Overview Heading'
              instructions: 'Large heading for the overview section (e.g. "A clear and concise digital platform for investors.").'
          -
            handle: overview_body
            field:
              type: bard
              display: 'Overview Body'
              instructions: 'Two to three short paragraphs describing the project. Links inline are fine.'
              remove_empty_nodes: false
              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - anchor
                - h3
          -
            handle: feature_list
            field:
              type: replicator
              display: 'Feature List'
              instructions: 'Key features shown below the overview body, each with an icon.'
              sets:
                new_set_group:
                  display: 'Features'
                  sets:
                    new_set:
                      display: 'Feature Item'
                      fields:
                        -
                          handle: fa_icon
                          field:
                            type: text
                            display: 'Font Awesome Icon'
                            instructions: 'Icon name without the fa- prefix, e.g. "calendar-check", "camera-retro", "bullhorn". See fontawesome.com/icons. Overridden by a Custom SVG Icon if uploaded below.'
                        -
                          handle: icon
                          field:
                            max_files: 1
                            container: assets
                            type: assets
                            display: 'Custom SVG Icon (optional)'
                            instructions: 'Optional. Takes priority over the Font Awesome Icon when uploaded.'
                        -
                          handle: label
                          field:
                            type: text
                            display: Label
                            instructions: 'Short title shown in bold (e.g. "Frictionless Online Booking").'
                        -
                          handle: description
                          field:
                            type: text
                            display: Description
                            instructions: 'Sentence-length description after the label.'
      -
        display: 'Screenshot 1'
        fields:
          -
            handle: screenshot_1
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Screenshot'
              instructions: 'Full website screenshot shown on a cream card, sits between Overview and Before/After.'
      -
        display: 'Before / After'
        fields:
          -
            handle: show_before_after
            field:
              type: toggle
              display: 'Show Before / After'
              default: false
          -
            handle: before_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Before Screenshot'
              instructions: 'Tall/mobile-shape screenshot of the old site.'
          -
            handle: after_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'After Screenshot'
              instructions: 'Tall/mobile-shape screenshot of the new site.'
      -
        display: 'What We Did'
        fields:
          -
            handle: what_we_did_heading
            field:
              type: text
              display: 'What We Did Heading'
          -
            handle: what_we_did_body
            field:
              type: bard
              display: 'What We Did Body'
              remove_empty_nodes: false
              buttons:
                - bold
                - italic
                - anchor
          -
            handle: what_we_did_features_heading
            field:
              type: text
              display: 'Key Enhancements Heading'
              default: 'Key Enhancements:'
          -
            handle: what_we_did_features
            field:
              type: replicator
              display: 'Key Enhancements List'
              instructions: 'Bulleted list of key enhancements. Each item renders as "Label: description".'
              sets:
                new_set_group:
                  display: 'Enhancements'
                  sets:
                    new_set:
                      display: 'Enhancement'
                      fields:
                        -
                          handle: label
                          field:
                            type: text
                            display: Label
                        -
                          handle: description
                          field:
                            type: text
                            display: Description
      -
        display: 'Screenshot 2'
        fields:
          -
            handle: screenshot_2
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Screenshot'
              instructions: 'Second full website screenshot shown on a cream card, sits between What We Did and The Result.'
      -
        display: 'The Result'
        fields:
          -
            handle: result_heading
            field:
              type: text
              display: 'Result Heading'
          -
            handle: result_body
            field:
              type: bard
              display: 'Result Body'
              remove_empty_nodes: false
              buttons:
                - bold
                - italic
                - anchor
          -
            handle: result_cards
            field:
              type: replicator
              display: 'Result Cards (3-column grid)'
              instructions: 'Short outcome statements shown as icon cards below The Result copy.'
              sets:
                new_set_group:
                  display: 'Cards'
                  sets:
                    new_set:
                      display: 'Result Card'
                      fields:
                        -
                          handle: fa_icon
                          field:
                            type: text
                            display: 'Font Awesome Icon'
                            instructions: 'Icon name without the fa- prefix, e.g. "star", "bolt", "chart-line". See fontawesome.com/icons. Overridden by a Custom SVG Icon if uploaded below.'
                        -
                          handle: icon
                          field:
                            max_files: 1
                            container: assets
                            type: assets
                            display: 'Custom SVG Icon (optional)'
                            instructions: 'Optional. Takes priority over the Font Awesome Icon when uploaded.'
                        -
                          handle: statement
                          field:
                            type: text
                            display: Statement
                            instructions: 'Short bold statement (e.g. "Integrated real-time share price updates for transparency.").'
      -
        display: 'Listing Card'
        fields:
          -
            handle: preview_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Preview Image'
          -
            handle: preview_background_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Preview Background Image'
          -
            handle: background_video
            field:
              type: video
              display: 'Background Video'
          -
            handle: intro_card_text
            field:
              type: text
              display: 'Intro Card Text (large card strapline)'
          -
            handle: card_text_2
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Card Text 2'
          -
            handle: card_image_2
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Card Image 2'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              localizable: true
              max_items: 1
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
