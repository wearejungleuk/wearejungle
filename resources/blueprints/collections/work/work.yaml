title: Work
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: seo_title
            field:
              type: text
              display: 'SEO Title'
          -
            handle: preview_text
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Preview Text'
          -
            handle: preview_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Preview Image'
          -
            handle: preview_background_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Preview Background Image'
          -
            handle: background_video
            field:
              type: video
              display: 'Background Video'
          -
            handle: intro_card_text
            field:
              type: text
              display: 'Intro Card Text (large card strapline)'
          -
            handle: card_text_2
            field:
              remove_empty_nodes: false
              type: bard
              display: 'Card Text 2'
          -
            handle: card_image_2
            field:
              max_files: 1
              container: assets
              type: assets
              display: 'Card Image 2'
          -
            handle: feature_list
            field:
              type: replicator
              display: 'Feature List'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    new_set:
                      display: 'Feature Item'
                      fields:
                        -
                          handle: icon
                          field:
                            max_files: 1
                            container: assets
                            type: assets
                            display: Icon
                        -
                          handle: label
                          field:
                            type: text
                            display: Label
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              localizable: true
              max_items: 1
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
