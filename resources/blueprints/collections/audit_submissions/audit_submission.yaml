title: 'Audit Submission'
tabs:
  main:
    display: Main
    sections:
      -
        display: Submission
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              instructions: 'Auto-generated: "Name - domain"'
              listable: true
          -
            handle: submitter_name
            field:
              type: text
              display: Name
              required: true
              listable: true
          -
            handle: submitter_email
            field:
              type: text
              display: Email
              input_type: email
              required: true
              listable: true
          -
            handle: website_url
            field:
              type: text
              display: 'Website URL'
              required: true
              listable: true
          -
            handle: marketing_budget
            field:
              type: select
              display: 'Monthly Marketing Budget'
              required: true
              listable: true
              options:
                under_750: 'Under £750'
                750_to_1500: '£750 to £1,500'
                1500_to_5000: '£1,500 to £5,000'
                5000_to_10000: '£5,000 to £10,000'
                10000_to_25000: '£10,000 to £25,000'
                25000_to_50000: '£25,000 to £50,000'
                50000_plus: '£50,000+'
      -
        display: 'Audit Tracking'
        fields:
          -
            handle: trakd_audit_id
            field:
              type: text
              display: 'Trakd Audit ID'
              instructions: 'The ID of the audit created in Trakd.'
          -
            handle: trakd_audit_status
            field:
              type: select
              display: 'Audit Status'
              listable: true
              default: pending
              options:
                pending: Pending
                complete: Complete
                failed: Failed
          -
            handle: trakd_share_url
            field:
              type: text
              display: 'Trakd Report URL'
              instructions: 'Public share URL of the audit report.'
          -
            handle: webhook_sent
            field:
              type: toggle
              display: 'Sent to Trakd Webhook'
              default: false
      -
        display: Meta
        fields:
          -
            handle: ip_address
            field:
              type: text
              display: 'IP Address'
              read_only: true
          -
            handle: submitted_at
            field:
              type: date
              display: 'Submitted At'
              time_enabled: true
              read_only: true
