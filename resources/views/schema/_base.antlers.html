{{#
    Sitewide schema base. Defines Organization + WebSite once so every
    other partial can reference them by @id. Also emits a generic
    WebPage entry for the current page. Include on every non-homepage
    template, alongside any page-specific schema partial.
#}}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "Organization",
            "@id": "https://wearejungle.co.uk/#org",
            "name": "We Are Jungle",
            "url": "https://wearejungle.co.uk",
            "logo": "https://we-are-jungle.s3.eu-north-1.amazonaws.com/we-are-jungle-logo_we-are-jungle-primary-logo-whitespace-cream.svg",
            "email": "hello@wearejungle.co.uk",
            "telephone": "+442392003967",
            "address": {
                "@type": "PostalAddress",
                "streetAddress": "Gatcombe House, Copnor Rd, Hilsea",
                "addressLocality": "Portsmouth",
                "postalCode": "PO3 5EJ",
                "addressCountry": "GB"
            },
            "sameAs": [
                "https://www.instagram.com/we.are.jungle/",
                "https://www.facebook.com/wearejungleuk/",
                "https://www.linkedin.com/company/71991154"
            ]
        },
        {
            "@type": "WebSite",
            "@id": "https://wearejungle.co.uk/#website",
            "name": "We Are Jungle",
            "url": "https://wearejungle.co.uk",
            "publisher": { "@id": "https://wearejungle.co.uk/#org" }
        },
        {
            "@type": "WebPage",
            "@id": "{{ permalink }}#webpage",
            "url": "{{ permalink }}",
            "name": {{ (meta_title ?? seo_title ?? title) | json }},
            {{ if meta_description || seo_description }}
            "description": {{ (meta_description ?? seo_description) | json }},
            {{ /if }}
            "isPartOf": { "@id": "https://wearejungle.co.uk/#website" }
        }
    ]
}
</script>
