<div
        x-data="{ open: false, scrolled: false }"
        x-init="window.addEventListener('scroll', () => { scrolled = window.scrollY > 100 })"
        x-cloak
        name="header-mobile"
        class="header__mobile block lg:hidden relative"
>
    <div class="w-full top-0 left-0 flex items-center justify-between z-[999]">
        <div class="container">
            <div class="flex justify-between items-center">
                <!-- Logo (swap on scroll) -->
                <div>
                    <a href="/">
                        {{ if brand:white_logo }}
                            {{ brand:white_logo }}
                            <img src="{{ url }}" alt="{{ alt }}" class="w-full max-w-[150px] xl:max-w-[200px] 3xl:max-w-[250px]" loading="lazy">
                            {{ /brand:white_logo }}
                        {{ /if }}
                    </a>
                </div>

                <div class="flex items-center justify-end gap-4">
                    <button
                        @click="open = !open"
                        class="flex flex-col gap-[5px] w-7 py-1"
                        aria-label="Open menu"
                    >
                        <span class="block h-[2px] w-full bg-white transition-all duration-300" :class="open ? 'rotate-45 translate-y-[7px]' : ''"></span>
                        <span class="block h-[2px] w-full bg-white transition-all duration-300" :class="open ? 'opacity-0' : ''"></span>
                        <span class="block h-[2px] w-full bg-white transition-all duration-300" :class="open ? '-rotate-45 -translate-y-[7px]' : ''"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Slideover partial (shares same Alpine state) -->
    {{ partial:layout/header-mobile-slideover }}
</div>
