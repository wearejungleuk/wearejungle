<header
    id="header"
    x-data="{ scrolled: false }"
    x-init="window.addEventListener('scroll', () => { scrolled = window.scrollY > 50 }, { passive: true })"
    :class="scrolled ? 'bg-brand-dark-blue' : 'bg-transparent'"
    class="fixed top-0 left-0 w-full max-w-[100vw] z-[9999999] transition-colors duration-300">
    <nav class="py-4 lg:py-6 3xl:py-8">
        {{# Mobile #}}
        {{ partial:layout/header-mobile }}

        {{# Desktop #}}
        {{ partial:layout/header-desktop }}
    </nav>
</header>
