<footer class="footer bg-white text-black rounded-tr-[50px] rounded-tl-[50px] pt-10 pb-6 lg:pt-14 lg:pb-8" id="footer">
    <div class="container container_full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 items-start">
            <div class="cols-span-1">
                <p class="font-heading uppercase text-[16px] mb-3">Contact</p>
                <p>
                    <a href="mailto:{{ brand:email }}" class="duration-300 transition-all hover:text-brand-secondary break-words">{{ brand:email }}</a>
                </p>
                <p>
                    <a href="tel:{{ brand:number }}" class="duration-300 transition-all hover:text-brand-secondary">{{ brand:number }}</a>
                </p>
            </div>
            <div class="cols-span-1">
                <p class="font-heading uppercase text-[16px] mb-3">We Are Jungle</p>
                <div>{{ brand:address }}</div>
            </div>
            <div class="cols-span-1 md:text-right">
                <p class="font-heading uppercase text-[16px] mb-3">Legal</p>
                <p><a href="/privacy-policy" class="duration-300 transition-all hover:text-brand-secondary">Privacy Policy</a></p>
                <p><a href="/terms" class="duration-300 transition-all hover:text-brand-secondary">Terms</a></p>
            </div>
        </div>
        <div class="pt-4 border-t mt-8 text-[14px] opacity-80">
            <p>&copy; {{ now format="Y" }} We Are Jungle Ltd | Company number 16357238</p>
        </div>
    </div>
</footer>
