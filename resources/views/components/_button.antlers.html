{{ if book_appointment }}
<a href="{{ brand:calendly_link }}" target="_blank"
   class="button group z-[1] {{ classes }}">
    <span>{{ title }}</span>
</a>
{{ else }}
<a href="{{ url }}" class="button group z-[1] {{ classes }}"
   {{ if target }}target="{{ target }}"{{ /if }}>
    <span>{{ title }}</span>
</a>
{{ /if }}
