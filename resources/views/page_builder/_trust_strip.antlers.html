<section class="bg-brand-primary py-8 lg:py-12">
    <div class="container">
        {{ if items }}
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                {{ items }}
                    <div class="flex items-start gap-4 bg-white text-black border-[3px] border-black rounded-[20px] p-5 lg:p-6 js-fade-up">
                        <div class="flex-shrink-0 w-[44px] h-[44px] rounded-full bg-brand-secondary text-brand-primary flex items-center justify-center">
                            <i class="fa-sharp fa-solid fa-{{ fa_icon ?? 'circle-check' }} text-[18px] lg:text-[20px]"></i>
                        </div>
                        <p class="text-[15px] lg:text-[16px] leading-snug font-heading uppercase self-center">{{ label }}</p>
                    </div>
                {{ /items }}
            </div>
        {{ /if }}
    </div>
</section>
