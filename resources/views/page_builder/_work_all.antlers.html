<section class="py-12 md:py-20 lg:py-28">
    <div class="container">
        <div class="flex flex-col gap-12 md:gap-0 md:flex-row md:flex-wrap md:-mx-4">
            {{ collection:work sort="order:asc" }}
            {{ entry_url = url }}
            <div class="w-full md:w-1/2 md:px-8 relative md:mb-[50px] js-fade-up {{ switch between='|md:translate-y-[100px]' }}">
                <a href="{{ entry_url }}" class="block group">
                    <div class="relative overflow-hidden rounded-[20px] min-h-[400px] py-32 mb-6 lg:mb-8">
                        {{ partial:components/work_card_media hoverable="true" }}
                    </div>
                    <h3 class="font-heading uppercase text-[25px] sm:text-[30px] md:text-[35px] lg:text-[40px]">{{ title }}</h3>
                    {{ if preview_text }}
                        <div class="mt-2 lg:mt-4">{{ preview_text }}</div>
                    {{ /if }}
                </a>
            </div>
            {{ /collection:work }}
        </div>
    </div>
    <input type="hidden" class="md:translate-y-[100px]">
</section>
