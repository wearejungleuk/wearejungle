<section class="bg-brand-primary py-16 lg:py-24">
    <div class="container">

        <div class="text-center max-w-[700px] mx-auto mb-12 lg:mb-16">
            {{ if above_title }}
                <div class="relative z-[10] js-fade-up flex justify-center">
                    {{ partial:components/above-title title="{ above_title }" classes="{ above_title_variant }" }}
                </div>
            {{ /if }}
            {{ if title }}
                <h2 class="font-heading uppercase text-[42px] sm:text-[52px] lg:text-[52px] xl:text-[58px] leading-none text-white mb-6 js-fade-up">{{ title }}</h2>
            {{ /if }}
            {{ if text }}
                <div class="bard text-white text-[16px] lg:text-[17px] js-fade-up">{{ text }}</div>
            {{ /if }}
        </div>

        {{ if stats }}
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 lg:gap-6">
                {{ stats }}
                <div
                    class="bg-brand-dark-blue p-8 lg:p-10 text-center js-fade-up"
                    style="border-radius: 20px"
                    x-data="{
                        display: '0',
                        animate() {
                            const raw = '{{ number }}';
                            const num = parseInt(raw);
                            const suffix = raw.replace(/[0-9]/g, '');
                            let frame = 0;
                            const total = 60;
                            const duration = 1200;
                            const timer = setInterval(() => {
                                frame++;
                                const eased = 1 - Math.pow(1 - frame / total, 3);
                                this.display = Math.round(eased * num) + suffix;
                                if (frame >= total) {
                                    clearInterval(timer);
                                    this.display = raw;
                                }
                            }, duration / total);
                        }
                    }"
                    x-intersect.once="animate()"
                >
                    <div class="font-heading uppercase text-[64px] lg:text-[80px] leading-none text-white mb-4" x-text="display"></div>
                    {{ if label }}
                        <p class="text-[16px] lg:text-[17px] text-white leading-snug">{{ label }}</p>
                    {{ /if }}
                </div>
                {{ /stats }}
            </div>
        {{ /if }}

    </div>
</section>
